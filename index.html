<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zapito</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 25px;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #222;
            color: white;
        }

        button:hover {
            background-color: #444;
        }

        #foto {
            display: none;
            margin-top: 30px;
        }

        #foto img {
            max-width: 90%;
            width: 400px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <h1>¿Querés conocer a Zapito?</h1>

    <button onclick="mostrarFoto()">
        Sí, quiero conocerlo
    </button>

    <div id="foto">
        <img src="zapito.jpeg" alt="Foto de Zapito">
    </div>

    <script>
        function mostrarFoto() {
            document.getElementById("foto").style.display = "block";
        }
    </script>

</body>
</html>
