<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>¿Querés conocer a Zapito?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #1a1a2e,
                #16213e,
                #0f3460
            );

            color: white;
            overflow: hidden;
        }

        /* Fondo con círculos */
        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.08);

            filter: blur(10px);

            animation: mover 8s infinite alternate ease-in-out;
        }

        body::before {
            top: -100px;
            left: -100px;
        }

        body::after {
            bottom: -100px;
            right: -100px;

            animation-delay: -4s;
        }

        @keyframes mover {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(80px, 50px) scale(1.2);
            }
        }

        /* Tarjeta principal */
        .contenedor {
            position: relative;
            z-index: 2;

            width: min(90%, 600px);

            padding: 50px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);

            animation: aparecer 1s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin-top: 0;
            margin-bottom: 15px;

            font-size: clamp(30px, 6vw, 50px);

            text-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .subtitulo {
            margin-bottom: 35px;

            font-size: 18px;

            opacity: 0.8;
        }

        /* Botón */
        button {
            border: none;

            padding: 16px 30px;

            border-radius: 50px;

            font-size: 18px;
            font-weight: bold;

            color: #16213e;

            background: white;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        button:hover {
            transform: scale(1.08);

            background: #eeeeee;

            box-shadow:
                0 10px 30px rgba(255, 255, 255, 0.25);
        }

        button:active {
            transform: scale(0.96);
        }

        /* Foto */
        #foto {
            display: none;

            margin-top: 35px;

            animation: aparecerFoto 0.8s ease;
        }

        @keyframes aparecerFoto {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #foto img {
            display: block;

            width: min(100%, 400px);

            margin: auto;

            border-radius: 20px;

            border: 4px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5);

            transition: transform 0.3s;
        }

        #foto img:hover {
            transform: scale(1.03);
        }

        /* Texto que aparece debajo */
        .mensaje {
            margin-top: 20px;

            font-size: 20px;

            font-weight: bold;

            animation: aparecer 0.8s ease;
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>¿Querés conocer a Zapito? 🐸</h1>

        <p class="subtitulo">
            Hay una forma de descubrirlo...
        </p>

        <button onclick="mostrarFoto()">
            ✨ Conocer a Zapito ✨
        </button>

        <div id="foto">

            <img src="zapito.jpeg" alt="Foto de Zapito">

            <div class="mensaje">
                ¡Este es Zapito! 🐸
            </div>

        </div>

    </main>

    <script>
        function mostrarFoto() {

            document.getElementById("foto").style.display = "block";

        }
    </script>

</body>
</html>
